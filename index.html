<title>Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#16202B; --muted:#5E6B78; --line:#D5DCE3; --live:#D7262E; --link:#0076B6;
  --under:#C8102E; --over:#1F5FA8; --up:#1E8A4C;
  --body:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0E141B; --surface:#18212B; --ink:#EEF2F6; --muted:#93A1AF; --line:#27323E; --live:#FF4D55; --link:#5AB2EE; --under:#FF6B7A; --over:#7FB2F0; --up:#4CC27F; }
}
:root[data-theme="dark"]{ --bg:#0E141B; --surface:#18212B; --ink:#EEF2F6; --muted:#93A1AF; --line:#27323E; --live:#FF4D55; --link:#5AB2EE; --under:#FF6B7A; --over:#7FB2F0; --up:#4CC27F; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 16px}
h1{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:-.01em}
#updated{color:var(--muted);font-size:14px;margin-top:4px}
#refresh{border:0;background:var(--surface);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,.tap:focus-visible{outline:3px solid var(--link);outline-offset:2px}
#refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pull{height:0;overflow:hidden;text-align:center;color:var(--muted);font-size:14px;transition:height .15s}

.card{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 0 0 1px var(--line)}
.band{background:var(--c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:4px solid var(--a)}
.band h2{font-family:var(--cond);font-weight:600;font-size:22px;margin:0;line-height:1.1}
.band .rec{font-family:var(--cond);font-size:17px;opacity:.9;white-space:nowrap}
.body{padding:12px 14px 14px}
.tap{cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
.tap:active{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.status{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.status.live{color:var(--live);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot,#refresh.spin svg{animation:none}}
.row{display:flex;align-items:center;gap:10px;padding:5px 0}
.row img{width:30px;height:30px;object-fit:contain}
.row .nm{flex:1;font-size:17px}
.row.us .nm{font-weight:600}
.row .poss{font-size:12px;color:var(--live)}
.row .sc{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row.lose .sc,.row.lose .nm{color:var(--muted)}
.sit{display:flex;align-items:center;gap:12px;margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--live) 8%,transparent);font-size:14px}
.sit b{font-weight:600}
.sit .lp{color:var(--muted);font-size:13px;margin-top:2px}
.hint{font-size:13px;color:var(--link);margin-top:6px}
.sub{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:0}
.saved{font-size:13px;color:var(--muted);text-align:center;margin:-6px 0 10px}

table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;font-weight:400}
th{color:var(--muted);font-size:13px;border-top:0;padding-top:0}
tr:first-child td{border-top:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.lb .pos{width:40px;color:var(--muted)}
.lb .tp{text-align:right;font-family:var(--cond);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;width:48px}
.lb .th{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.lb tr.pin td:nth-child(2){font-weight:600}
.mv{font-size:12px;margin-left:4px}
.mv.u{color:var(--up)} .mv.d{color:var(--under)}
.pdetail td{border-top:0;padding:2px 4px 12px}
.rounds{font-size:14px;color:var(--muted);margin-bottom:6px}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;font-variant-numeric:tabular-nums;margin-top:4px}
.holes div{text-align:center;font-size:14px;padding:3px 0;border-radius:5px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.holes small{display:block;font-size:10px;color:var(--muted)}
.holes .under{color:var(--under);font-weight:600}
.holes .over{color:var(--over);font-weight:600}
.subhead{font-family:var(--cond);font-weight:600;font-size:18px;margin:14px 0 6px}
.subhead:first-child{margin-top:0}
.us-row td{font-weight:600;background:color-mix(in srgb,var(--c,#0076B6) 10%,transparent)}
.link{border:0;background:none;color:var(--link);font-weight:600;font-size:15px;padding:8px 0 0;cursor:pointer}
a{color:var(--link)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:100px;font-size:11px !important;border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{color:var(--link);font-weight:600}

#sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet[hidden]{display:none}
#sheet .top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;z-index:2;border-bottom:1px solid var(--line)}
#sheet .top button{border:0;background:var(--surface);padding:8px 14px;border-radius:20px;box-shadow:0 0 0 1px var(--line);cursor:pointer;font-weight:600}
#sheetBody{max-width:560px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.scorehead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.scorehead img{width:48px;height:48px;object-fit:contain}
.scorehead .big{font-family:var(--cond);font-weight:700;font-size:48px;line-height:1}
.scorehead .tn{font-weight:600;font-size:15px}
.scorehead .mid{font-size:14px;color:var(--muted);max-width:110px}
.wp svg{width:100%;height:auto;display:block}
.plays li{list-style:none;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.plays li:first-child{border-top:0}
.plays{padding:0;margin:0}
.plays .meta{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}

.mini .row{padding:3px 0}
.mini .row img{width:24px;height:24px}
.mini .row .nm{font-size:16px}
.mini .row .sc{font-size:26px}
.rk{font-size:12px;color:var(--muted);font-weight:600;margin-right:3px}
.recs{font-size:12px;color:var(--muted);margin-left:4px}
.ctrl{display:flex;gap:8px}
.ctrl select{flex:1}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step b{font-family:var(--cond);font-size:20px;font-weight:600}
.favline{box-shadow:inset 4px 0 0 var(--link)}
.day{font-family:var(--cond);font-weight:600;font-size:19px;margin:18px 4px 6px}
.day:first-child{margin-top:0}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .tm{width:64px;flex:none;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.srow .tm.live{color:var(--live);font-weight:600}
.srow .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.srow .what{flex:1;font-size:15px}
.srow .what small{display:block;color:var(--muted);font-size:13px}
.news{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.news:first-child{border-top:0}
.news img{width:72px;height:54px;object-fit:cover;border-radius:6px;flex:none}
.news b{font-weight:600;font-size:15px;display:block}
.news small{color:var(--muted);font-size:13px}
.inj{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.inj:first-child{border-top:0}
.inj .st{font-weight:600}
.inj .st.out{color:var(--live)}
.inj small{display:block;color:var(--muted);font-size:13px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-width:116px;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:8px 10px;box-shadow:0 0 0 1px var(--line);cursor:pointer;display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--muted)}
.pill b{color:var(--ink);font-size:15px}
.pill[aria-pressed="true"]{box-shadow:0 0 0 2px var(--link)}
.pill.hr{min-width:72px;align-items:center;text-align:center}
.pill .best{color:var(--up);font-weight:600}
.wxhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.big2{font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.1}
.wxgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:16px}
.wxgrid small{display:block;font-size:12px;color:var(--muted)}
.m{color:var(--muted)}
.wxgrid .m{font-size:13px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.form2 label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form2 select,.form2 input[type=number]{width:100%;font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:0 0 6px}
.form2 .chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px}
.answer{margin-top:10px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--link) 10%,transparent)}
table.clubs{font-size:15px}
table.clubs td,table.clubs th{padding:6px 3px}
input[type=number]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.setrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .sw{width:14px;height:28px;border-radius:4px;background:var(--c);flex:none}
.setrow span.n{flex:1}
.ib{border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px}
.ib:disabled{opacity:.3}
select,input[type=text]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.btn{border:0;background:var(--link);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--live);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.4}
</style>
</head>
<body>
<main>
  <div id="pull">Release to refresh</div>
  <header>
    <div><h1 id="title">Scores</h1><div id="updated">Loading…</div></div>
    <button id="refresh" aria-label="Refresh">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <div id="list"></div>
</main>

<nav>
  <button data-view="scores" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M7 10v4M17 10v4"/></svg>Scores</button>
  <button data-view="schedule"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button data-view="league"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>League</button>
  <button data-view="standings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Standings</button>
  <button data-view="weather"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 22V3"/><path d="M5 4h11l-3 4 3 4H5"/><path d="M15 17h6M13 20h6"/></svg>Weather</button>
  <button data-view="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.2-.6L12 2l2.8 6.6 7.2.6-5.4 4.8 1.6 7z"/></svg>Favorites</button>
</nav>

<div id="sheet" hidden>
  <div class="top"><span id="sheetTitle" style="font-weight:600"></span><button id="sheetClose">Done</button></div>
  <div id="sheetBody"></div>
</div>

<script>
const BASE = 'https://site.api.espn.com/apis/site/v2/sports/';
const BASE2 = 'https://site.api.espn.com/apis/v2/sports/';

const LEAGUES = {
  'nfl':                     {sport:'football',   label:'NFL'},
  'college-football':        {sport:'football',   label:'College football', sb:'?groups=80', tl:'?groups=80&limit=400', college:true},
  'nba':                     {sport:'basketball', label:'NBA'},
  'mens-college-basketball': {sport:'basketball', label:"Men's college basketball", sb:'?groups=50', tl:'?groups=50&limit=400', college:true},
  'nhl':                     {sport:'hockey',     label:'NHL'},
  'mlb':                     {sport:'baseball',   label:'MLB'},
  'eng.1':                   {sport:'soccer',     label:'Premier League'},
};
const TOURS = {
  pga:  {label:'PGA Tour',      c:'#1D3B2A', a:'#C9A94B'},
  lpga: {label:'LPGA Tour',     c:'#1B3C73', a:'#C8102E'},
  eur:  {label:'DP World Tour', c:'#0E1C3D', a:'#00A3E0'},
};
const golfFav = t => ({kind:'golf', tour:t, name:TOURS[t].label, c:TOURS[t].c, a:TOURS[t].a});
const DEFAULT_FAVS = [
  {kind:'team', league:'nfl', id:'8', abbr:'DET', name:'Detroit Lions', c:'#0076B6', a:'#B0B7BC'},
  {kind:'team', league:'nhl', id:'5', abbr:'DET', name:'Detroit Red Wings', c:'#CE1126', a:'#7A0A12'},
  {kind:'team', league:'mlb', id:'6', abbr:'DET', name:'Detroit Tigers', c:'#0C2340', a:'#FA4616'},
  golfFav('pga'),
  {kind:'team', league:'college-football', id:'130', abbr:'MICH', name:'Michigan Wolverines', c:'#00274C', a:'#FFCB05'},
  golfFav('lpga'),
  golfFav('eur'),
];

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let favs = store.get('favs', DEFAULT_FAVS);
let golfers = store.get('golfers', []);
// Upgrade saved favorites: tag golf with a tour, drop leagues no longer offered, add the new tours once.
favs = favs.map(f => f.kind === 'golf' && !f.tour ? {...f, tour:'pga'} : f).filter(f => f.kind === 'golf' ? TOURS[f.tour] : LEAGUES[f.league]);
if (!store.get('mig4', false)){
  for (const t of ['lpga', 'eur']) if (!favs.some(f => f.kind === 'golf' && f.tour === t)) favs.push(golfFav(t));
  store.set('mig4', true); store.set('favs', favs);
}
const saveFavs = () => { store.set('favs', favs); store.set('golfers', golfers); };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const keyOf = f => f.kind === 'golf' ? 'golf:' + f.tour : f.league + ':' + f.id;
const favByKey = k => favs.find(f => keyOf(f) === k);
const sportOf = f => LEAGUES[f.league]?.sport;
const api = f => `${BASE}${sportOf(f)}/${f.league}`;
const scoreOf = c => { const s = c?.score; if (s == null) return ''; return typeof s === 'object' ? (s.displayValue ?? s.value ?? '') : s; };
const statusOf = ev => ev?.status || ev?.competitions?.[0]?.status || {};
const isUs = (c, f) => c?.team && (String(c.team.id) === String(f.id) || (!c.team.id && c.team.abbreviation === f.abbr));
const when = d => new Date(d).toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
const clock = d => new Date(d).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const hex = c => c ? (c[0] === '#' ? c : '#' + c) : '#5E6B78';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

async function getJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------- Scores data ---------- */
async function loadTeam(f){
  const p = api(f);
  const [sb, tm, sch] = await Promise.allSettled([
    getJSON(`${p}/scoreboard${LEAGUES[f.league].sb || ''}`),
    getJSON(`${p}/teams/${f.id}`),
    getJSON(`${p}/teams/${f.id}/schedule`)
  ]);
  const out = {key: keyOf(f)};
  if (sb.status === 'fulfilled')
    out.game = (sb.value.events || []).find(e => e.competitions?.[0]?.competitors?.some(c => isUs(c, f)));
  if (tm.status === 'fulfilled'){
    const t = tm.value.team || {};
    out.record = t.record?.items?.[0]?.summary || '';
    out.next = t.nextEvent?.[0];
  }
  if (sch.status === 'fulfilled'){
    const now = Date.now(), horizon = now + 14 * 864e5;
    out.upcoming = (sch.value.events || []).filter(e => !statusOf(e).type?.completed && new Date(e.date) > now - 5 * 36e5 && new Date(e.date) < horizon);
    out.last = (sch.value.events || [])
      .filter(e => statusOf(e).type?.completed && new Date(e.date) <= now)
      .sort((a, b) => new Date(b.date) - new Date(a.date))[0];
  }
  out.error = sb.status === 'rejected' && tm.status === 'rejected';
  out.primary = out.game || out.next;
  out.upcoming = out.upcoming || [];
  for (const e of [out.game, out.next]) if (e && !statusOf(e).type?.completed && new Date(e.date) < Date.now() + 14 * 864e5 && !out.upcoming.some(u => u.id === e.id)) out.upcoming.push(e);
  out.live = statusOf(out.primary).type?.state === 'in';
  return out;
}
async function loadGolf(f){
  const d = await getJSON(BASE + 'golf/' + f.tour + '/scoreboard');
  const ev = d.events?.[0];
  const now = Date.now(), horizon = now + 14 * 864e5;
  const cal = (d.leagues?.[0]?.calendar || []).filter(c => c && typeof c === 'object' && c.startDate)
    .filter(c => new Date(c.endDate || c.startDate) >= now - 864e5 && new Date(c.startDate) < horizon)
    .map(c => ({label: c.label, start: c.startDate, end: c.endDate}));
  if (ev && !cal.some(c => c.label === ev.name) && new Date(ev.date) < horizon) cal.unshift({label: ev.name, start: ev.date, end: ev.endDate});
  return {key: keyOf(f), ev, cal, live: statusOf(ev).type?.state === 'in'};
}

/* ---------- Live situation ---------- */
function situationHTML(s, comps, sport){
  if (!s) return '';
  const abbrFor = id => comps.find(c => String(c.team?.id ?? c.id) === String(id))?.team?.abbreviation || '';
  const lp = s.lastPlay?.text ? `<div class="lp">${esc(s.lastPlay.text)}</div>` : '';
  if (sport === 'baseball'){
    const on = b => b ? 'var(--live)' : 'none';
    const diamond = `<svg width="38" height="30" viewBox="0 0 38 30" aria-hidden="true">
      <rect x="14" y="2" width="10" height="10" transform="rotate(45 19 7)" fill="${on(s.onSecond)}" stroke="currentColor" stroke-width="1.5"/>
      <rect x="25" y="12" width="10" height="10" transform="rotate(45 30 17)" fill="${on(s.onFirst)}" stroke="currentColor" stroke-width="1.5"/>
      <rect x="3" y="12" width="10" height="10" transform="rotate(45 8 17)" fill="${on(s.onThird)}" stroke="currentColor" stroke-width="1.5"/></svg>`;
    const outs = s.outs != null ? `${s.outs} out${s.outs === 1 ? '' : 's'}` : '';
    const count = s.balls != null ? `, ${s.balls}-${s.strikes} count` : '';
    const bat = s.batter?.athlete?.shortName || s.batter?.athlete?.displayName;
    return `<div class="sit">${diamond}<div><b>${esc(outs)}${esc(count)}</b>${bat ? `<div>At bat: ${esc(bat)}</div>` : ''}${lp}</div></div>`;
  }
  if (sport === 'football'){
    const dd = s.downDistanceText || s.shortDownDistanceText;
    if (!dd && !lp) return '';
    const poss = s.possession ? abbrFor(s.possession) : '';
    return `<div class="sit"><div><b>${poss ? esc(poss) + ' ball' : ''}${poss && dd ? ', ' : ''}${esc(dd || '')}</b>${s.isRedZone ? ' <span style="color:var(--live)">Red zone</span>' : ''}${lp}</div></div>`;
  }
  const pp = s.isPowerPlay || s.powerPlay;
  if (!pp && !lp) return '';
  return `<div class="sit"><div>${pp ? '<b>Power play</b>' : ''}${lp}</div></div>`;
}

/* ---------- Scores rendering ---------- */
function statusLine(ev){
  const st = statusOf(ev).type || {};
  if (st.state === 'in') return `<div class="status live"><span class="dot"></span>Live, ${esc(st.shortDetail)}</div>`;
  if (st.state === 'post') return `<div class="status">${esc(st.shortDetail || 'Final')}</div>`;
  const comp = ev.competitions?.[0];
  const tv = comp?.broadcasts?.[0]?.names?.[0] || comp?.geoBroadcasts?.[0]?.media?.shortName || '';
  return `<div class="status">${esc(when(ev.date))}${tv ? ', ' + esc(tv) : ''}</div>`;
}
function summary(ev, f, label){
  const comp = ev?.competitions?.[0]; if (!comp) return '';
  const us = comp.competitors.find(c => isUs(c, f)), them = comp.competitors.find(c => !isUs(c, f));
  if (!us || !them) return '';
  const where = us.homeAway === 'home' ? 'vs' : 'at';
  if (statusOf(ev).type?.completed){
    const r = us.winner ? 'W' : them.winner ? 'L' : 'T';
    return `${label}: ${r} ${esc(scoreOf(us))}–${esc(scoreOf(them))} ${where} ${esc(them.team.abbreviation)}`;
  }
  return `${label}: ${where} ${esc(them.team.abbreviation)}, ${esc(when(ev.date))}`;
}
const tapAttrs = (f, ev) => `class="tap" role="button" tabindex="0" data-open="${esc(keyOf(f))}|${esc(ev.id)}"`;

function teamCard(d, f){
  let html = '';
  if (d.error) html = `<p class="empty">Scores couldn't load. Check your connection and tap refresh.</p>`;
  else if (!d.primary){
    html = `<p class="empty">No upcoming games scheduled.</p>`;
    if (d.last) html += `<div class="sub tap" ${tapAttrs(f, d.last).slice(12)}>${summary(d.last, f, 'Last')}</div>`;
  } else {
    const ev = d.primary, comp = ev.competitions[0], state = statusOf(ev).type?.state;
    const teams = [...comp.competitors].sort(a => (a.homeAway === 'away' ? -1 : 1));
    const possId = comp.situation?.possession;
    html = `<div ${tapAttrs(f, ev)}>` + statusLine(ev) + teams.map(c => {
      const logo = c.team.logo || c.team.logos?.[0]?.href || '';
      const lose = state === 'post' && !c.winner && teams.some(t => t.winner);
      const poss = state === 'in' && possId && String(possId) === String(c.team.id) ? ' <span class="poss" aria-label="has the ball">●</span>' : '';
      return `<div class="row${isUs(c, f) ? ' us' : ''}${lose ? ' lose' : ''}">
        ${logo ? `<img src="${esc(logo)}" alt="">` : ''}
        <span class="nm">${esc(c.team.shortDisplayName || c.team.displayName)}${poss}</span>
        <span class="sc">${state === 'pre' ? '' : esc(scoreOf(c))}</span></div>`;
    }).join('');
    if (state === 'in') html += situationHTML(comp.situation, comp.competitors, sportOf(f));
    html += `<div class="hint">${state === 'pre' ? 'Game preview' : 'Box score and plays'}</div></div>`;
    let subEv = null, sub = '';
    if (state === 'post' && d.next && d.next.id !== ev.id){ subEv = d.next; sub = summary(d.next, f, 'Next'); }
    else if (state !== 'post' && d.last && d.last.id !== ev.id){ subEv = d.last; sub = summary(d.last, f, 'Last'); }
    if (sub) html += `<div class="sub tap" role="button" tabindex="0" data-open="${esc(keyOf(f))}|${esc(subEv.id)}">${sub}</div>`;
  }
  html += `<button class="link" data-team="${esc(keyOf(f))}">News and injuries ›</button>`;
  return frame(f, d.record, html);
}

const openPlayers = new Set();
const golfShowAll = new Set();
function golferRow(p, st, pinned){
  const pid = String(p.id || p.athlete?.id || p.athlete?.displayName);
  const pos = p.status?.position?.displayName || p.order || '';
  let thru = '';
  if (st.state === 'in'){
    const t = p.status?.thru;
    if (t >= 18) thru = 'F';
    else if (t > 0) thru = 'Thru ' + t;
    else if (p.status?.teeTime) thru = clock(p.status.teeTime);
  }
  const mvRaw = Number(p.movement ?? p.status?.movement);
  const mv = mvRaw > 0 ? `<span class="mv u">▲${mvRaw}</span>` : mvRaw < 0 ? `<span class="mv d">▼${-mvRaw}</span>` : '';
  const open = openPlayers.has(pid);
  let row = `<tr class="tap${pinned ? ' pin' : ''}" role="button" tabindex="0" data-player="${esc(pid)}" aria-expanded="${open}">
    <td class="pos">${esc(pos)}</td><td>${esc(p.athlete?.displayName || p.athlete?.shortName)}${mv}</td>
    <td class="th">${esc(thru)}</td><td class="tp">${esc(scoreOf(p))}</td></tr>`;
  if (open) row += `<tr class="pdetail"><td colspan="4">${playerDetail(p)}</td></tr>`;
  return row;
}
function playerDetail(p){
  const rounds = (p.linescores || []).filter(r => r.value != null || r.displayValue);
  let html = '';
  if (rounds.length) html += `<div class="rounds">${rounds.map(r => `R${esc(r.period)}: ${esc(r.value ?? r.displayValue)}`).join(', ')}</div>`;
  const cur = [...(p.linescores || [])].reverse().find(r => r.linescores?.length);
  if (cur){
    const holes = [...cur.linescores].sort((a, b) => a.period - b.period);
    html += `<div class="rounds">Round ${esc(cur.period)}, hole by hole</div><div class="holes">` + holes.map(h => {
      const t = String(h.scoreType?.displayValue ?? '');
      const cls = t.startsWith('-') ? 'under' : t.startsWith('+') ? 'over' : '';
      return `<div class="${cls}"><small>${esc(h.period)}</small>${esc(h.value ?? h.displayValue)}</div>`;
    }).join('') + `</div>`;
  }
  if (p.status?.teeTime && !(p.status?.thru > 0)) html += `<div class="rounds">Tee time: ${esc(when(p.status.teeTime))}</div>`;
  return html || '<div class="rounds">No round details yet.</div>';
}
function golfCard(d, f){
  const ev = d.ev;
  if (d.error) return frame(f, '', `<p class="empty">The leaderboard couldn't load. Tap refresh to try again.</p>`);
  if (!ev) return frame(f, '', `<p class="empty">No tournament this week.</p>`);
  const st = statusOf(ev).type || {};
  const comp = ev.competitions?.[0] || {};
  const players = [...(comp.competitors || [])].sort((a, b) => (a.sortOrder ?? a.order ?? 999) - (b.sortOrder ?? b.order ?? 999));
  const mine = golfers.map(g => players.find(p => norm(p.athlete?.displayName).includes(norm(g)))).filter(Boolean);
  let html = `<div style="font-weight:600;font-size:17px;margin-bottom:2px">${esc(ev.name || ev.shortName)}</div>`;
  const started = st.state !== 'pre' && players.length && scoreOf(players[0]) !== '';
  html += !started ? `<div class="status">Starts ${esc(when(ev.date))}</div>`
    : st.state === 'in' ? `<div class="status live"><span class="dot"></span>${esc(st.shortDetail || 'In progress')}</div>`
    : `<div class="status">${esc(st.shortDetail || 'Final')}</div>`;
  if (golfers.length){
    html += `<div class="subhead">Your players</div>`;
    html += mine.length ? `<table class="lb">${mine.map(p => golferRow(p, st, true)).join('')}</table>`
      : `<p class="empty">None of your players are in this week's field.</p>`;
  }
  if (started){
    const showAll = golfShowAll.has(keyOf(f)), n = showAll ? players.length : 10;
    html += `<div class="subhead">Leaderboard</div><table class="lb">${players.slice(0, n).map(p => golferRow(p, st, false)).join('')}</table>`;
    if (players.length > 10) html += `<button class="link" data-act="golfall" data-key="${esc(keyOf(f))}">${showAll ? 'Show top 10' : 'Show full leaderboard'}</button>`;
  }
  return frame(f, '', html);
}
function frame(f, rec, inner){
  return `<section class="card" style="--c:${esc(f.c)};--a:${esc(f.a)}">
    <div class="band"><h2>${esc(f.name)}</h2>${rec ? `<span class="rec">${esc(rec)}</span>` : ''}</div>
    <div class="body">${inner}</div></section>`;
}

/* ---------- Game detail ---------- */
let detail = null, detailTimer = null;
function periodLabel(sport, league, n){
  const reg = {football:4, hockey:3, basketball: league === 'mens-college-basketball' ? 2 : 4, soccer:2}[sport];
  if (!reg || n <= reg) return String(n);
  return n === reg + 1 ? 'OT' : (n - reg) + 'OT';
}
async function openGame(key, eventId){
  const lg = key.startsWith('lg:') ? key.slice(3) : null;
  const f = favByKey(key) || (lg && LEAGUES[lg] ? {kind:'team', league:lg, name:LEAGUES[lg].label} : null);
  if (!f) return;
  detail = {f, eventId};
  $('#sheetTitle').textContent = f.name;
  $('#sheetBody').innerHTML = '<p class="empty">Loading…</p>';
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  await loadDetail();
}
function closeGame(){
  $('#sheet').hidden = true; document.body.style.overflow = ''; $('#sheetTitle').textContent = '';
  detail = null; clearTimeout(detailTimer);
}
async function loadDetail(){
  if (!detail) return;
  const {f, eventId} = detail;
  clearTimeout(detailTimer);
  try {
    const d = await getJSON(`${api(f)}/summary?event=${eventId}`);
    if (!detail || detail.eventId !== eventId) return;
    $('#sheetBody').innerHTML = renderDetail(d, f);
    if (d.header?.competitions?.[0]?.status?.type?.state === 'in') detailTimer = setTimeout(loadDetail, 30000);
  } catch {
    $('#sheetBody').innerHTML = `<p class="empty">Game details couldn't load. Close this and try again.</p>`;
  }
}
function renderDetail(d, f){
  const sport = sportOf(f);
  const comp = d.header?.competitions?.[0] || {};
  const st = comp.status?.type || {};
  const teams = [...(comp.competitors || [])].sort(a => (a.homeAway === 'away' ? -1 : 1));
  const [away, home] = teams;
  if (!away || !home) return '<p class="empty">No details for this game yet.</p>';
  const tname = c => c.team?.abbreviation || c.team?.shortDisplayName || '';
  const color = c => { const fav = favs.find(x => x.kind === 'team' && x.league === f.league && String(x.id) === String(c.team?.id)); return fav ? fav.c : hex(c.team?.color); };
  const logo = c => c.team?.logos?.[0]?.href || c.team?.logo || '';
  const showScore = st.state !== 'pre';
  let h = `<section class="card"><div class="body"><div class="scorehead">
    ${[away, null, home].map(c => c === null
      ? `<div class="mid">${st.state === 'in' ? `<div class="status live" style="justify-content:center;margin:0"><span class="dot"></span>Live</div>` : ''}${esc(st.state === 'pre' ? when(comp.date) : (st.detail || st.shortDetail))}</div>`
      : `<div>${logo(c) ? `<img src="${esc(logo(c))}" alt="">` : ''}<div class="tn">${esc(c.team?.shortDisplayName || tname(c))}</div>${c.record?.[0]?.summary || c.record?.[0]?.displayValue ? `<div class="status" style="justify-content:center;margin:0">${esc(c.record[0].summary || c.record[0].displayValue)}</div>` : ''}<div class="big">${showScore ? esc(scoreOf(c)) : ''}</div></div>`
    ).join('')}</div>`;
  if (st.state === 'in') h += situationHTML(d.situation || comp.situation, comp.competitors, sport);
  h += `</div></section>`;

  // Line score
  const cols = Math.max(away.linescores?.length || 0, home.linescores?.length || 0);
  if (showScore && cols){
    const lsv = (c, i) => c.linescores?.[i]?.displayValue ?? c.linescores?.[i]?.value ?? '';
    h += `<section class="card"><div class="body"><div class="subhead">Line score</div><div class="scroll"><table>
      <tr><th></th>${Array.from({length:cols}, (_, i) => `<th class="num">${periodLabel(sport, f.league, i + 1)}</th>`).join('')}<th class="num">T</th></tr>
      ${[away, home].map(c => `<tr><td>${esc(tname(c))}</td>${Array.from({length:cols}, (_, i) => `<td class="num">${esc(lsv(c, i))}</td>`).join('')}<td class="num"><b>${esc(scoreOf(c))}</b></td></tr>`).join('')}
    </table></div></div></section>`;
  }

  // Win probability
  const wp = d.winprobability || [];
  if (wp.length > 1){
    const W = 320, H = 120;
    const pts = wp.map((w, i) => `${(i / (wp.length - 1) * W).toFixed(1)},${((1 - w.homeWinPercentage) * H).toFixed(1)}`).join(' ');
    const now = wp[wp.length - 1].homeWinPercentage;
    const lead = now >= .5 ? home : away, pct = Math.round((now >= .5 ? now : 1 - now) * 100);
    h += `<section class="card"><div class="body"><div class="subhead">Win probability</div>
      <div class="status" style="margin-bottom:6px">${esc(tname(lead))} ${st.state === 'post' ? 'finished at' : 'now at'} ${pct}%</div>
      <div class="wp"><svg viewBox="-28 -4 ${W + 32} ${H + 8}" role="img" aria-label="Win probability over the game">
        <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)" stroke-dasharray="4 4"/>
        <line x1="0" x2="${W}" y1="0" y2="0" stroke="var(--line)"/><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
        <text x="-4" y="10" text-anchor="end" font-size="11" fill="var(--muted)">${esc(tname(home))}</text>
        <text x="-4" y="${H}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(tname(away))}</text>
        <polyline points="${pts}" fill="none" stroke="${esc(color(home))}" stroke-width="2.5" stroke-linejoin="round"/>
      </svg></div></div></section>`;
  }

  // Leaders
  const leaders = d.leaders || [];
  if (leaders.length === 2 && showScore){
    const byTeam = id => leaders.find(l => String(l.team?.id) === String(id));
    const la = byTeam(away.team?.id), lh = byTeam(home.team?.id);
    const cats = (la?.leaders || []).slice(0, 4);
    if (cats.length){
      const top = (grp, name) => { const g = grp?.leaders?.find(x => x.name === name || x.displayName === name); const l = g?.leaders?.[0]; return l ? `${esc(l.athlete?.shortName || l.athlete?.displayName)}<div class="meta" style="color:var(--muted);font-size:13px">${esc(l.displayValue)}</div>` : ''; };
      h += `<section class="card"><div class="body"><div class="subhead">Leaders</div><table>
        <tr><th></th><th>${esc(tname(away))}</th><th>${esc(tname(home))}</th></tr>
        ${cats.map(c => `<tr><td style="color:var(--muted);font-size:13px">${esc(c.displayName)}</td><td>${top(la, c.name)}</td><td>${top(lh, c.name)}</td></tr>`).join('')}
      </table></div></section>`;
    }
  }

  // Scoring plays
  let plays = d.scoringPlays || [];
  if (!plays.length && d.plays) plays = d.plays.filter(p => p.scoringPlay);
  if (plays.length){
    const ab = id => comp.competitors.find(c => String(c.team?.id ?? c.id) === String(id))?.team?.abbreviation || '';
    h += `<section class="card"><div class="body"><div class="subhead">Scoring plays</div><ul class="plays">` +
      plays.map(p => {
        const per = p.period?.displayValue || (p.period?.number ? (sport === 'football' || sport === 'basketball' ? 'Q' : sport === 'hockey' ? 'P' : '') + periodLabel(sport, f.league, p.period.number) : '');
        const t = p.team?.abbreviation || ab(p.team?.id);
        const sc = p.awayScore != null ? `${tname(away)} ${p.awayScore}, ${tname(home)} ${p.homeScore}` : '';
        return `<li><div class="meta">${esc([t, per, p.clock?.displayValue].filter(Boolean).join(', '))}</div>${esc(p.text)}${sc ? `<div class="meta">${esc(sc)}</div>` : ''}</li>`;
      }).join('') + `</ul></div></section>`;
  }

  // Team stats
  const bt = d.boxscore?.teams || [];
  if (bt.length === 2 && showScore){
    const flat = t => { let s = t.statistics || []; if (s[0]?.stats) s = s.flatMap(g => g.stats.slice(0, 6).map(x => ({...x, label: (g.displayName || g.name || '') + ' ' + (x.label || x.abbreviation || x.name)}))); return s; };
    const ta = bt.find(t => String(t.team?.id) === String(away.team?.id)) || bt[0];
    const th = bt.find(t => String(t.team?.id) === String(home.team?.id)) || bt[1];
    const sa = flat(ta), sh = flat(th);
    const rows = sa.slice(0, 16).map((s, i) => [s.label || s.abbreviation || s.name, s.displayValue, (sh.find(x => x.name === s.name && x.label === s.label) || sh[i])?.displayValue]).filter(r => r[1] != null);
    if (rows.length) h += `<section class="card"><div class="body"><div class="subhead">Team stats</div><table>
      <tr><th></th><th class="num">${esc(tname(away))}</th><th class="num">${esc(tname(home))}</th></tr>
      ${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td><td class="num">${esc(r[2] ?? '')}</td></tr>`).join('')}
    </table></div></section>`;
  }

  // Pregame info
  if (st.state === 'pre'){
    const venue = d.gameInfo?.venue?.fullName;
    const tv = comp.broadcasts?.[0]?.media?.shortName;
    const odds = d.pickcenter?.[0];
    const bits = [venue && `Venue: ${venue}`, tv && `TV: ${tv}`, odds?.details && `Line: ${odds.details}`, odds?.overUnder && `Over/under: ${odds.overUnder}`].filter(Boolean);
    h += `<section class="card"><div class="body"><div class="subhead">Game info</div>${bits.length ? bits.map(b => `<div>${esc(b)}</div>`).join('') : '<p class="empty">More details will appear closer to game time.</p>'}</div></section>`;
  }
  return h;
}

/* ---------- Standings ---------- */
const COLS = {
  football:   [['W','wins'],['L','losses'],['T','ties'],['PCT','winPercent'],['STRK','streak']],
  hockey:     [['GP','gamesPlayed'],['W','wins'],['L','losses'],['OTL','otLosses'],['PTS','points']],
  baseball:   [['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['STRK','streak']],
  basketball: [['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind']],
  soccer:     [['GP','gamesPlayed'],['W','wins'],['D','ties'],['L','losses'],['PTS','points']],
};
const statVal = (e, name) => { const s = (e.stats || []).find(x => x.name === name || x.type === name); return s ? (s.displayValue ?? s.value) : null; };
const statNum = (e, name) => { const s = (e.stats || []).find(x => x.name === name); return s ? Number(s.value) : NaN; };
function findPath(node, id, path = []){
  const here = [...path, node];
  if (node.standings?.entries?.some(e => String(e.team?.id) === String(id))) return here;
  for (const ch of node.children || []){ const r = findPath(ch, id, here); if (r) return r; }
  return null;
}
const allEntries = n => [...(n.standings?.entries || []), ...(n.children || []).flatMap(allEntries)];
function sortEntries(entries, sport){
  const hasSeed = entries.some(e => !isNaN(statNum(e, 'playoffSeed')) && statNum(e, 'playoffSeed') > 0);
  const k = sport === 'hockey' || sport === 'soccer' ? 'points' : 'winPercent';
  return [...entries].sort((a, b) => hasSeed ? (statNum(a, 'playoffSeed') || 99) - (statNum(b, 'playoffSeed') || 99) : (statNum(b, k) || 0) - (statNum(a, k) || 0));
}
async function loadStandingsFor(f){
  const sport = sportOf(f);
  const tries = LEAGUES[f.league].college ? ['', '?level=3'] : ['?level=3', ''];
  for (const q of tries){
    try {
      const d = await getJSON(`${BASE2}${sport}/${f.league}/standings${q}`);
      const path = findPath(d, f.id);
      if (path){
        const leaf = path[path.length - 1], parent = path.length > 2 ? path[path.length - 2] : null;
        return {key: keyOf(f), group: {name: leaf.name || leaf.abbreviation, entries: leaf.standings.entries},
          parent: parent && parent !== d ? {name: parent.name, entries: allEntries(parent)} : null};
      }
    } catch {}
  }
  return {key: keyOf(f), error: true};
}
async function loadRankings(league){
  const d = await getJSON(`${BASE}${LEAGUES[league].sport}/${league}/rankings`);
  const r = (d.rankings || []).find(x => /AP/i.test(x.name || x.shortName || '')) || d.rankings?.[0];
  return r ? {name: r.name, ranks: r.ranks || []} : null;
}
async function loadFedex(){
  const d = await getJSON(`${BASE2}golf/pga/standings`);
  const e = allEntries(d);
  if (!e.length) throw new Error('empty');
  return {name: d.name || 'FedEx Cup', entries: e.slice(0, 30)};
}
function standingsTable(entries, f, sport){
  const cols = (COLS[sport] || COLS.football).filter(([, n]) => entries.some(e => statVal(e, n) != null && !(n === 'ties' && sport === 'football' && entries.every(x => !Number(statNum(x, 'ties'))))));
  const seed = entries.some(e => statNum(e, 'playoffSeed') > 0);
  return `<div class="scroll"><table><tr>${seed ? '<th class="num">#</th>' : ''}<th>Team</th>${cols.map(([l]) => `<th class="num">${l}</th>`).join('')}</tr>` +
    sortEntries(entries, sport).map(e => `<tr class="${String(e.team?.id) === String(f.id) ? 'us-row' : ''}" style="--c:${esc(f.c)}">
      ${seed ? `<td class="num">${esc(statNum(e, 'playoffSeed') > 0 ? statNum(e, 'playoffSeed') : '')}</td>` : ''}
      <td>${esc(e.team?.shortDisplayName || e.team?.abbreviation || e.team?.displayName)}</td>
      ${cols.map(([, n]) => `<td class="num">${esc(statVal(e, n) ?? '')}</td>`).join('')}</tr>`).join('') + `</table></div>`;
}
const openParents = new Set();
let standings = store.get('cache:standings', null);
function renderStandings(){
  if (!standings){ $('#list').innerHTML = '<p class="empty">Loading standings…</p>'; return; }
  let html = '';
  for (const f of favs){
    if (f.kind === 'golf'){
      if (f.tour !== 'pga') continue;
      const fx = standings.fedex;
      html += frame(f, '', fx && fx.entries ? `<div class="subhead">${esc(fx.name)}</div><table>` +
        fx.entries.map((e, i) => `<tr><td class="num" style="width:36px">${esc(statVal(e, 'rank') ?? i + 1)}</td><td>${esc(e.athlete?.displayName || e.team?.displayName || e.displayName)}</td><td class="num">${esc(statVal(e, 'points') ?? statVal(e, 'cupPoints') ?? '')}</td></tr>`).join('') + `</table>`
        : `<p class="empty">FedEx Cup standings aren't available from this scores feed. <a href="https://www.pgatour.com/fedexcup" target="_blank" rel="noopener">See them on PGATour.com</a>.</p>`);
      continue;
    }
    const s = standings.teams?.[keyOf(f)];
    const sport = sportOf(f);
    let inner = '';
    if (!s || s.error) inner = `<p class="empty">Standings couldn't load for this team.</p>`;
    else {
      inner = `<div class="subhead">${esc(s.group.name)}</div>` + standingsTable(s.group.entries, f, sport);
      if (s.parent){
        const k = keyOf(f), open = openParents.has(k);
        inner += `<button class="link" data-act="parent" data-key="${esc(k)}">${open ? 'Hide' : 'Show'} ${esc(s.parent.name)}</button>`;
        if (open) inner += `<div class="subhead">${esc(s.parent.name)}</div>` + standingsTable(s.parent.entries, f, sport);
      }
    }
    html += frame(f, '', inner);
  }
  for (const [lg, r] of Object.entries(standings.rankings || {})){
    if (!r) continue;
    const myIds = favs.filter(f => f.league === lg).map(f => String(f.id));
    html += `<section class="card"><div class="band" style="--c:#2B3440;--a:#8592A0"><h2>${esc(r.name)}</h2><span class="rec">${esc(LEAGUES[lg].label)}</span></div><div class="body"><table>` +
      r.ranks.map(x => `<tr class="${myIds.includes(String(x.team?.id)) ? 'us-row' : ''}"><td class="num" style="width:36px">${esc(x.current)}</td><td>${esc(x.team?.location || x.team?.nickname || x.team?.name)}</td><td class="num" style="color:var(--muted)">${esc(x.recordSummary || '')}</td></tr>`).join('') +
      `</table></div></section>`;
  }
  $('#list').innerHTML = html;
}
async function refreshStandings(){
  const teams = favs.filter(f => f.kind === 'team');
  const res = await Promise.all(teams.map(loadStandingsFor));
  const colleges = [...new Set(teams.filter(f => LEAGUES[f.league].college).map(f => f.league))];
  const rk = await Promise.all(colleges.map(l => loadRankings(l).catch(() => null)));
  const fedex = favs.some(f => f.kind === 'golf' && f.tour === 'pga') ? await loadFedex().catch(() => null) : null;
  standings = {teams: Object.fromEntries(res.map(r => [r.key, r])), rankings: Object.fromEntries(colleges.map((l, i) => [l, rk[i]])), fedex, at: Date.now()};
  store.set('cache:standings', standings);
}

      <select id="lg"><option value="">Choose a league</option>${Object.entries(LEAGUES).map(([k, v]) => `<option value="${k}" ${k === teamLeague ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
      <label for="tm" class="status">Team</label>
      <select id="tm" ${teamList.length ? '' : 'disabled'}>${teamList.length ? teamList.map(t => `<option value="${esc(t.id)}">${esc(t.displayName)}</option>`).join('') : '<option>Choose a league first</option>'}</select>
      <button class="btn" data-act="addteam" ${teamList.length ? '' : 'disabled'}>Add team</button>
      ${(() => { const left = Object.keys(TOURS).filter(t => !favs.some(f => f.kind === 'golf' && f.tour === t)); return left.length ? `<div class="subhead" style="margin-top:16px">Add a golf tour</div><select id="tour" aria-label="Golf tour">${left.map(t => `<option value="${t}">${esc(TOURS[t].label)}</option>`).join('')}</select><button class="btn" data-act="addgolf">Add tour</button>` : ''; })()}
    </div></section>
    <section class="card"><div class="body"><div class="subhead">Your golfers</div>
      <p class="empty" style="font-size:14px;margin-bottom:8px">These players are pinned to the top of the leaderboard whenever they're in the field.</p>
      ${golfers.map((g, i) => `<div class="setrow"><span class="n">${esc(g)}</span><button class="ib" data-act="rmgolfer" data-i="${i}" aria-label="Remove ${esc(g)}">✕</button></div>`).join('')}
      <input type="text" id="golfer" list="field" placeholder="Player name, like Scottie Scheffler" autocomplete="off">
      <datalist id="field">${field.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <button class="btn" data-act="addgolfer">Add golfer</button>

    <div style="text-align:center"><button class="btn ghost" data-act="reset">Reset to original favorites</button></div>`;

async function pickLeague(lg){
  teamLeague = lg; teamList = [];
  renderSettings();
  if (!lg) return;
  try {
    const L = LEAGUES[lg];
    const d = await getJSON(`${BASE}${L.sport}/${lg}/teams${L.tl || ''}`);
    teamList = (d.sports?.[0]?.leagues?.[0]?.teams || []).map(x => x.team).filter(Boolean).sort((a, b) => a.displayName.localeCompare(b.displayName));
  } catch { teamList = []; alert('Teams couldn\'t load. Check your connection and try again.'); }
  if (teamLeague === lg) renderSettings();
}

/* ---------- Schedule ---------- */
function renderSchedule(){
  const byKey = Object.fromEntries(scores.map(d => [d.key, d]));
  const items = [];
  for (const f of favs){
    const d = byKey[keyOf(f)]; if (!d) continue;
    if (f.kind === 'golf') for (const c of d.cal || []) items.push({f, golf: c, date: new Date(c.start)});
    else for (const ev of d.upcoming || []) items.push({f, ev, date: new Date(ev.date)});
  }
  items.sort((a, b) => a.date - b.date);
  if (!items.length){ $('#list').innerHTML = `<p class="empty">${scores.length ? 'Nothing scheduled in the next two weeks.' : 'Loading…'}</p>`; return; }
  const today = new Date().toDateString(), tmw = new Date(Date.now() + 864e5).toDateString();
  let html = '', cur = null;
  for (const it of items){
    const k = it.date < new Date() ? today : it.date.toDateString();
    if (k !== cur){
      if (cur) html += '</section>';
      const label = k === today ? 'Today' : k === tmw ? 'Tomorrow' : new Date(k).toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});
      html += `<div class="day">${esc(label)}</div><section class="card">`;
      cur = k;
    }
    const f = it.f;
    if (it.golf){
      const g = it.golf, end = g.end ? new Date(g.end) : null;
      const md = d => d.toLocaleDateString([], {month:'short', day:'numeric'});
      html += `<div class="srow" style="--c:${esc(f.c)}"><span class="tm">${it.date < new Date() ? 'Ongoing' : 'Starts'}</span><span class="sw"></span><span class="what">${esc(g.label)}<small>${esc(f.name)}${end ? `, ${esc(md(it.date))} to ${esc(md(end))}` : ''}</small></span></div>`;
      continue;
    }
    const ev = it.ev, comp = ev.competitions?.[0] || {};
    const us = comp.competitors?.find(c => isUs(c, f)), them = comp.competitors?.find(c => !isUs(c, f));
    const st = statusOf(ev).type || {};
    const tv = comp.broadcasts?.[0]?.media?.shortName || comp.broadcasts?.[0]?.names?.[0] || comp.geoBroadcasts?.[0]?.media?.shortName || '';
    const time = st.state === 'in' ? 'Live' : (ev.timeValid === false || comp.timeValid === false) ? 'TBD' : clock(ev.date);
    const opp = them ? `${us?.homeAway === 'home' ? 'vs' : 'at'} ${them.team?.shortDisplayName || them.team?.displayName || them.team?.abbreviation}` : (ev.shortName || ev.name || '');

/* ---------- Golf weather ---------- */
const DEFAULT_CLUBS = [['Driver',270],['5 wood',240],['3 hybrid',230],['4 hybrid',220],['4 iron',205],['5 iron',195],['6 iron',180],['7 iron',165],['8 iron',155],['9 iron',140],['PW',125],['52°',110],['58°',80]];
let clubs = store.get('clubs', DEFAULT_CLUBS);
let wxCourses = store.get('wxCourses', [{name:'Franklin, MI', lat:42.5223, lon:-83.3060}]);
let wxSel = store.get('wxSel', 0);
const wx = {day:0, hourIdx:null, clock:null, rel:store.get('wxRel', ''), slope:0, target:'', cold:false, manage:false, results:[], clubsOpen:false};
const wxData = {};
let wxAt = 0, tourney = null, tourneyTried = false;
const BASE_T = 70, BASE_P = 1013.25, BASE_RH = 50;   // assumed sim baseline: 70°F, sea level
const clubType = n => /driver|wood/i.test(n) ? 'wood' : /hybrid/i.test(n) ? 'hybrid' : /iron/i.test(n) ? 'iron' : 'wedge';
const DRIFT = {wood:.06, hybrid:.05, iron:.045, wedge:.05};   // yds of drift per mph per 10 yds of distance
const SLOPE = {wood:1.1, hybrid:1.05, iron:1, wedge:.9};       // flatter landings feel elevation more
const REL = [['225','Back left'],['180','Back'],['135','Back right'],['90','Right'],['45','Front right'],['0','Front'],['315','Front left'],['270','Left']];
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dirName = deg => DIRS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
const ckey = c => `${c.lat.toFixed(3)},${c.lon.toFixed(3)}`;
const allCourses = () => [...wxCourses, ...(tourney ? [tourney] : [])];
const curCourse = () => { const l = allCourses(); if (wxSel >= l.length) wxSel = 0; return l[wxSel]; };
const fmtHour = h => `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
const hourOf = s => Number(s.slice(11, 13));
const tParse = s => Date.parse(s.length === 10 ? s + 'T00:00Z' : s + 'Z');
function density(tc, p, rh){
  const es = 6.1078 * Math.pow(10, 7.5 * tc / (tc + 237.3)), pv = rh / 100 * es, pd = p - pv, tk = tc + 273.15;
  return (pd * 100) / (287.05 * tk) + (pv * 100) / (461.5 * tk);
}
const RHO0 = density((BASE_T - 32) * 5 / 9, BASE_P, BASE_RH);

function wxURL(c){
  return `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}` +
    `&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,precipitation,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index` +
    `&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max` +
    `&past_days=2&forecast_days=7&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto`;
}
async function findTourney(){
  tourneyTried = true;
  const ev = scores.find(d => d.key === 'golf:pga')?.ev;
  if (!ev || statusOf(ev).type?.state === 'post') return;
  const a = ev.competitions?.[0]?.venue?.address || ev.courses?.[0]?.address || ev.venue?.address || {};
  if (!a.city) return;
  try {
    const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(a.city)}&count=10&language=en&format=json`);
    const st = norm(a.state);
    const r = (g.results || []).find(x => st && (norm(x.admin1) === st || norm(x.admin1_code) === st)) || g.results?.[0];
    if (r) tourney = {name: ev.name, place: [a.city, a.state].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude, start: ev.date, end: ev.endDate, isTourney: true};
  } catch {}
}
async function loadWeather(){
  if (!tourneyTried) await findTourney();
  const list = [curCourse(), tourney].filter(Boolean);
  await Promise.all(list.map(async c => {
    try { wxData[ckey(c)] = await getJSON(wxURL(c)); } catch { if (!wxData[ckey(c)]) wxData[ckey(c)] = {error: true}; }
  }));
  wxAt = Date.now();
}

function dayInfo(d){
  const off = (d.utc_offset_seconds || 0) * 1000, nowLoc = Date.now() + off;
  const today = new Date(nowLoc).toISOString().slice(0, 10);
  const days = d.daily.time.map((t, i) => ({t, i})).filter(x => x.t >= today);
  return {nowLoc, today, days};
}
function hoursFor(d, day, nowLoc){
  const di = d.daily.time.indexOf(day);
  const sr = hourOf(d.daily.sunrise[di]), ss = hourOf(d.daily.sunset[di]);
  const curHourStart = Math.floor(nowLoc / 36e5) * 36e5;
  return d.hourly.time.map((t, i) => ({t, i})).filter(x => x.t.startsWith(day) && tParse(x.t) >= curHourStart && ((hourOf(x.t) >= sr && hourOf(x.t) <= ss) || tParse(x.t) === curHourStart));
}
function bestTee(d, day, nowLoc){
  const hrs = hoursFor(d, day, nowLoc), H = d.hourly;
  const di = d.daily.time.indexOf(day), ss = hourOf(d.daily.sunset[di]), sr = hourOf(d.daily.sunrise[di]);
  const score = i => H.wind_speed_10m[i] + .3 * H.wind_gusts_10m[i] + .3 * (H.precipitation_probability[i] ?? 0) + .4 * Math.abs(H.temperature_2m[i] - 72) + (H.precipitation[i] > 0 ? 10 : 0);
  let best = null;
  for (const {t, i} of hrs){
    if (hourOf(t) < sr) continue;
    if (hourOf(t) > ss - 4) break;
    const w = [0, 1, 2, 3].map(k => i + k).filter(k => k < H.time.length);
    const s = w.reduce((a, k) => a + score(k), 0) / w.length;
    if (!best || s < best.s) best = {s, i, h: hourOf(t)};
  }
  return best;
}
function airAt(d, i){
  const H = d.hourly, tf = H.temperature_2m[i], tc = (tf - 32) * 5 / 9, rh = H.relative_humidity_2m[i] ?? 50;
  const p = H.surface_pressure[i] || 1013.25 * Math.pow(1 - 2.25577e-5 * (d.elevation || 0), 5.25588);
  let f = 1 - .5 * (density(tc, p, rh) / RHO0 - 1);
  if (wx.cold) f -= .0008 * Math.max(0, 70 - tf);
  return {f, tf, p, rh};
}
function calcClub(name, yds, ctx){
  const type = clubType(name), base = yds * ctx.air, W = ctx.wind;
  const slopeAdj = ctx.slopeFt / 3 * SLOPE[type];
  const r = {calm: base - slopeAdj, into: base * (1 - .01 * W) - slopeAdj, down: base * (1 + .005 * W) - slopeAdj, drift: DRIFT[type] * W * yds / 10};
  if (ctx.shotDir !== null){
    const a = (ctx.windFrom - ctx.shotDir) * Math.PI / 180, head = W * Math.cos(a), cross = W * Math.sin(a);
    r.shot = base * (head > 0 ? 1 - .01 * head : 1 - .005 * head) - slopeAdj;
    r.sdrift = DRIFT[type] * Math.abs(cross) * yds / 10;
    r.side = cross > 0 ? 'L' : 'R';
  }
  return r;
}

  // Tournament weather
  if (tourney && !c.isTourney){
    const td = wxData[ckey(tourney)];
    if (td && !td.error){
      const s = new Date(tourney.start).toISOString().slice(0, 10);
      const e = tourney.end ? new Date(tourney.end).toISOString().slice(0, 10) : null;
      const rows = td.daily.time.map((t, k) => ({t, k})).filter(x => x.t >= s && (e ? x.t <= e : x.t < new Date(tParse(s) + 4 * 864e5).toISOString().slice(0, 10))).slice(0, 4);
      if (rows.length) html += `<section class="card" style="--c:#1D3B2A;--a:#C9A94B"><div class="band"><h2>${esc(tourney.name)}</h2><span class="rec">${esc(tourney.place)}</span></div><div class="body"><table>
        <tr><th>Round</th><th class="num">High</th><th class="num">Wind</th><th class="num">Gusts</th><th class="num">Rain</th></tr>` +
        rows.map((x, r) => `<tr><td>R${r + 1}, ${esc(new Date(tParse(x.t)).toLocaleDateString([], {weekday:'short', timeZone:'UTC'}))}</td><td class="num">${Math.round(td.daily.temperature_2m_max[x.k])}°</td><td class="num">${Math.round(td.daily.wind_speed_10m_max[x.k])}</td><td class="num">${Math.round(td.daily.wind_gusts_10m_max[x.k])}</td><td class="num">${td.daily.precipitation_probability_max[x.k] ?? 0}%</td></tr>`).join('') +
        `</table><button class="link" data-act="wxtour">Open full tournament forecast</button></div></section>`;
    }
  }
  $('#list').innerHTML = html;
}
function fmtTime(s){ const h = hourOf(s), m = s.slice(14, 16); return `${h % 12 || 12}:${m} ${h < 12 ? 'AM' : 'PM'}`; }
function wxSaveCourses(){ store.set('wxCourses', wxCourses); store.set('wxSel', wxSel); }
async function wxSearch(){
  const q = $('#wxq').value.trim(); if (!q) return;
  wx.pendingName = $('#wxname').value.trim();
  try {
    const g = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    wx.results = g.results || [];
    if (!wx.results.length) alert('No places found. Try a nearby town name.');
  } catch { alert('Search failed. Check your connection.'); }
  renderWeather();
  if (wx.pendingName && $('#wxname')) $('#wxname').value = wx.pendingName;
}
function wxAddCourse(c){
  wxCourses.push(c); wxSel = wxCourses.length - 1; wx.results = []; wx.manage = false; wx.hourIdx = null; wx.day = 0;
  wxSaveCourses(); renderWeather(); refresh();
}

/* ---------- League scores ---------- */
const LEAGUE_GROUPS = {
  'college-football':        [['top25','Top 25'],['1','ACC'],['5','Big Ten'],['4','Big 12'],['9','Pac-12'],['8','SEC']],
  'mens-college-basketball': [['top25','Top 25'],['2','ACC'],['4','Big East'],['7','Big Ten'],['8','Big 12'],['21','Pac-12'],['23','SEC']],
};
let lgSel = store.get('lgSel', {league:'nfl', group:'top25'});
if (!LEAGUES[lgSel.league]) lgSel = {league:'nfl', group:'top25'};
let lgData = null, lgAt = 0, lgOffset = 0, lgBase = null;
const isFootball = () => LEAGUES[lgSel.league].sport === 'football';
const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
function lgDay(){ const d = new Date(); d.setDate(d.getDate() + lgOffset); return d; }
function lgURL(){
  const L = LEAGUES[lgSel.league], q = ['limit=300'];
  if (L.college) q.push('groups=' + (lgSel.group === 'top25' ? (lgSel.league === 'college-football' ? '80' : '50') : lgSel.group));
  if (isFootball()){ if (lgOffset && lgBase) q.push('week=' + Math.max(1, lgBase.week + lgOffset), 'seasontype=' + lgBase.type); }
  else if (lgOffset) q.push('dates=' + ymd(lgDay()));
  return `${BASE}${L.sport}/${lgSel.league}/scoreboard?` + q.join('&');
}
const rankOf = c => { const r = c.curatedRank?.current; return r >= 1 && r <= 25 ? r : null; };
async function loadLeague(){
  const want = lgURL();
  try {
    const d = await getJSON(want);
    if (want !== lgURL()) return;
    if (isFootball() && !lgOffset && d.week?.number) lgBase = {week: d.week.number, type: d.season?.type || 2};
    let evs = d.events || [];
    if (LEAGUES[lgSel.league].college && lgSel.group === 'top25')
      evs = evs.filter(e => e.competitions?.[0]?.competitors?.some(rankOf));
    const rank = e => ({in:0, pre:1, post:2})[statusOf(e).type?.state] ?? 1;
    evs.sort((a, b) => rank(a) - rank(b) || new Date(a.date) - new Date(b.date));
    lgData = {events: evs, week: d.week?.number, error: false};
  } catch { lgData = {events: [], error: true}; }
  lgAt = Date.now();
}
function lgLabel(){
  if (isFootball()){
    const w = lgBase ? Math.max(1, lgBase.week + lgOffset) : lgData?.week;
    return w ? (lgBase?.type === 3 ? 'Postseason week ' : 'Week ') + w : 'This week';
  }
  if (!lgOffset) return 'Today';
  if (lgOffset === -1) return 'Yesterday';
  if (lgOffset === 1) return 'Tomorrow';
  return lgDay().toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
}
function renderLeague(){
  const L = LEAGUES[lgSel.league], groups = LEAGUE_GROUPS[lgSel.league];
  let html = `<section class="card"><div class="body">
    <div class="ctrl">
      <select id="lgl" aria-label="League">${Object.entries(LEAGUES).map(([k, v]) => `<option value="${k}" ${k === lgSel.league ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select>
      ${groups ? `<select id="lgg" aria-label="Conference or Top 25">${groups.map(([k, v]) => `<option value="${k}" ${k === lgSel.group ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>` : ''}
    </div>
    <div class="step"><button class="ib" data-act="lgprev" aria-label="Previous ${isFootball() ? 'week' : 'day'}">‹</button><b>${esc(lgLabel())}</b><button class="ib" data-act="lgnext" aria-label="Next ${isFootball() ? 'week' : 'day'}">›</button></div>
  </div></section>`;
  if (!lgData) html += '<p class="empty">Loading games…</p>';
  else if (lgData.error) html += `<p class="empty">Games couldn't load. Check your connection and tap refresh.</p>`;
  else if (!lgData.events.length) html += `<p class="empty">No ${groups ? esc(groups.find(g => g[0] === lgSel.group)?.[1] || '') + ' ' : ''}games ${isFootball() ? 'this week' : lgOffset ? 'on this day' : 'today'}.</p>`;
  else {
    const favIds = favs.filter(f => f.league === lgSel.league).map(f => String(f.id));
    html += lgData.events.map(ev => {
      const comp = ev.competitions?.[0] || {}, state = statusOf(ev).type?.state;
      const teams = [...(comp.competitors || [])].sort(a => (a.homeAway === 'away' ? -1 : 1));
      const mine = teams.some(c => favIds.includes(String(c.team?.id)));
      return `<section class="card mini${mine ? ' favline' : ''}"><div class="body tap" role="button" tabindex="0" data-open="lg:${esc(lgSel.league)}|${esc(ev.id)}">` +
        statusLine(ev) + teams.map(c => {
          const lose = state === 'post' && !c.winner && teams.some(t => t.winner);
          const rk = L.college ? rankOf(c) : null;
          const rec = c.records?.[0]?.summary;
          return `<div class="row${lose ? ' lose' : ''}${favIds.includes(String(c.team?.id)) ? ' us' : ''}">
            ${c.team?.logo ? `<img src="${esc(c.team.logo)}" alt="">` : ''}
            <span class="nm">${rk ? `<span class="rk">${rk}</span>` : ''}${esc(c.team?.shortDisplayName || c.team?.displayName)}${rec ? `<span class="recs">${esc(rec)}</span>` : ''}</span>
            <span class="sc">${state === 'pre' ? '' : esc(scoreOf(c))}</span></div>`;
        }).join('') + (state === 'in' ? situationHTML(comp.situation, comp.competitors, L.sport) : '') + `</div></section>`;
    }).join('');
  }
  $('#list').innerHTML = html;
}
function lgChanged(){ lgOffset = 0; lgBase = null; lgData = null; store.set('lgSel', lgSel); renderLeague(); refresh(); }

/* ---------- App shell ---------- */
let view = 'scores', scores = store.get('cache:scores', []), scoresAt = store.get('cache:scoresAt', 0), timer = null, fromCache = scores.length > 0;
function renderScores(){
  const byKey = Object.fromEntries(scores.map(d => [d.key, d]));
  const order = favs.map((f, i) => ({f, i, d: byKey[keyOf(f)]})).filter(x => x.d)
    .sort((a, b) => (b.d.live - a.d.live) || a.i - b.i);
  $('#list').innerHTML = (fromCache ? `<div class="saved">Showing saved scores while updating</div>` : '') +
    (order.length ? order.map(({f, d}) => f.kind === 'golf' ? golfCard(d, f) : teamCard(d, f)).join('')
      : favs.length ? '<p class="empty">Loading…</p>' : '<p class="empty">Add favorites in the Favorites tab.</p>');
}
function render(){
  $('#title').textContent = {scores:'Scores', weather:'Golf weather', schedule:'Schedule', league:'League', standings:'Standings', settings:'Favorites'}[view];
  $('#refresh').style.visibility = view === 'settings' ? 'hidden' : 'visible';
  document.querySelectorAll('nav button').forEach(b => b.toggleAttribute('aria-current', b.dataset.view === view));
  document.querySelectorAll('nav button[aria-current]').forEach(b => b.setAttribute('aria-current', 'page'));
  if (view === 'scores') renderScores();
  else if (view === 'schedule') renderSchedule();
  else if (view === 'weather') renderWeather();
  else if (view === 'league') renderLeague();
  else if (view === 'standings') renderStandings();
  else renderSettings();
  setUpdated();
}
function setUpdated(){
  const t = view === 'weather' ? wxAt : view === 'standings' ? standings?.at : view === 'schedule' ? scoresAt : view === 'league' ? lgAt : scoresAt;
  $('#updated').textContent = view === 'settings' ? 'Tap ↑ ↓ to reorder' : t ? 'Updated ' + clock(t) : 'Loading…';
}
let busy = false;
async function refresh(){
  if (busy) return; busy = true;
  $('#refresh').classList.add('spin');
  try {
    if (view === 'standings'){ await refreshStandings(); }
    else if (view === 'league'){ await loadLeague(); }
    else if (view === 'weather'){ await loadWeather(); }
    else {
      const res = await Promise.all(favs.map(f =>
        (f.kind === 'golf' ? loadGolf(f) : loadTeam(f)).catch(() => ({key: keyOf(f), error: true, live: false}))));
      scores = res; scoresAt = Date.now(); fromCache = false;
      store.set('cache:scores', scores); store.set('cache:scoresAt', scoresAt);
    }
  } finally {
    busy = false;
    $('#refresh').classList.remove('spin');
    if (view !== 'settings') render();
    if (view === 'league' && !lgData) setTimeout(refresh, 0);
    clearTimeout(timer);
    const anyLive = view === 'weather' ? false : view === 'league' ? (lgData?.events || []).some(e => statusOf(e).type?.state === 'in') : scores.some(d => d.live);
    timer = setTimeout(refresh, anyLive ? 30000 : 300000);
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-team],[data-player],[data-act],nav button');
  if (!t) return;
  if (t.matches('nav button')){
    view = t.dataset.view; window.scrollTo(0, 0); render();
    if (view === 'standings' && (!standings || Date.now() - standings.at > 600000)) refresh();
    if ((view === 'scores' || view === 'schedule') && Date.now() - scoresAt > 60000) refresh();
    if (view === 'league' && (!lgData || Date.now() - lgAt > 60000)) refresh();
    if (view === 'weather' && (!wxData[ckey(curCourse())] || Date.now() - wxAt > 900000)) refresh();
    return;
  }
  if (t.dataset.team){ openTeam(t.dataset.team); return; }
  if (t.dataset.open){ const [k, id] = t.dataset.open.split('|'); openGame(k, id); return; }
  if (t.dataset.player){ const id = t.dataset.player; openPlayers.has(id) ? openPlayers.delete(id) : openPlayers.add(id); renderScores(); return; }
  const act = t.dataset.act, i = Number(t.dataset.i);
  if (act === 'wxday'){ wx.day = i; wx.hourIdx = null; renderWeather(); return; }
  if (act === 'wxhour'){ wx.hourIdx = i; wx.clock = wxData[ckey(curCourse())] ? hourOf(wxData[ckey(curCourse())].hourly.time[i]) : null; renderWeather(); return; }
  if (act === 'wxnow'){ wx.day = 0; wx.hourIdx = null; wx.clock = null; renderWeather(); return; }
  if (act === 'wxmanage'){ wx.manage = !wx.manage; wx.results = []; renderWeather(); return; }
  if (act === 'wxsearch'){ wxSearch(); return; }
  if (act === 'wxadd'){ const r = wx.results[i]; if (r) wxAddCourse({name: ($('#wxname')?.value.trim()) || [r.name, r.admin1].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude}); return; }
  if (act === 'wxgeo'){
    const nm = $('#wxname')?.value.trim();
    if (!navigator.geolocation){ alert('Location isn\'t available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(p => wxAddCourse({name: nm || 'My location', lat: p.coords.latitude, lon: p.coords.longitude}),
      () => alert('Couldn\'t get your location. Check that Safari has location access.'), {enableHighAccuracy: false, timeout: 10000});
    return;
  }
  if (act === 'wxrm'){ wxCourses.splice(i, 1); wxSel = 0; wx.hourIdx = null; wxSaveCourses(); renderWeather(); refresh(); return; }
  if (act === 'wxtour'){ wxSel = wxCourses.length; wx.day = 0; wx.hourIdx = null; window.scrollTo(0, 0); renderWeather(); return; }
  if (act === 'wxclubs'){ wx.clubsOpen = !wx.clubsOpen; renderWeather(); return; }
  if (act === 'clubreset'){ if (confirm('Reset all club distances to the originals?')){ clubs = JSON.parse(JSON.stringify(DEFAULT_CLUBS)); store.set('clubs', clubs); renderWeather(); } return; }
  if (act === 'lgprev' || act === 'lgnext'){ lgOffset += act === 'lgprev' ? -1 : 1; lgData = null; renderLeague(); refresh(); }
  else if (act === 'golfall'){ const k = t.dataset.key; golfShowAll.has(k) ? golfShowAll.delete(k) : golfShowAll.add(k); renderScores(); }
  else if (act === 'parent'){ const k = t.dataset.key; openParents.has(k) ? openParents.delete(k) : openParents.add(k); renderStandings(); }
  else if (act === 'up' && i > 0){ [favs[i - 1], favs[i]] = [favs[i], favs[i - 1]]; saveFavs(); renderSettings(); }
  else if (act === 'down' && i < favs.length - 1){ [favs[i + 1], favs[i]] = [favs[i], favs[i + 1]]; saveFavs(); renderSettings(); }
  else if (act === 'remove'){ favs.splice(i, 1); saveFavs(); standings = null; renderSettings(); }
  else if (act === 'addteam'){
    const tm = teamList.find(x => String(x.id) === $('#tm').value);
    if (!tm) return;
    const f = {kind:'team', league: teamLeague, id: String(tm.id), abbr: tm.abbreviation, name: tm.displayName, c: hex(tm.color), a: hex(tm.alternateColor)};
    if (!favs.some(x => keyOf(x) === keyOf(f))){ favs.push(f); saveFavs(); standings = null; scoresAt = 0; }
    teamList = []; teamLeague = ''; renderSettings();
  }
  else if (act === 'addgolf'){ const tr = $('#tour')?.value; if (!TOURS[tr]) return; favs.push(golfFav(tr)); saveFavs(); scoresAt = 0; standings = null; renderSettings(); }
  else if (act === 'addgolfer'){
    const v = $('#golfer').value.trim();
    if (v && !golfers.some(g => norm(g) === norm(v))){ golfers.push(v); saveFavs(); }
    renderSettings();
  }
  else if (act === 'rmgolfer'){ golfers.splice(i, 1); saveFavs(); renderSettings(); }
  else if (act === 'reset'){ if (confirm('Reset favorites and golfers to the originals?')){ favs = JSON.parse(JSON.stringify(DEFAULT_FAVS)); golfers = []; saveFavs(); standings = null; scoresAt = 0; renderSettings(); } }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tap')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'wxq'){ e.preventDefault(); wxSearch(); }
  if (e.key === 'Enter' && e.target.id === 'golfer'){ e.preventDefault(); document.querySelector('[data-act="addgolfer"]').click(); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeGame();
});
document.addEventListener('change', e => {
  if (e.target.id === 'lg') pickLeague(e.target.value);
  if (e.target.id === 'lgl'){ lgSel = {league: e.target.value, group: 'top25'}; lgChanged(); }
  if (e.target.id === 'lgg'){ lgSel.group = e.target.value; lgChanged(); }
  if (e.target.id === 'wxc'){ wxSel = Number(e.target.value); wx.day = 0; wx.hourIdx = null; wx.clock = null; store.set('wxSel', wxSel); renderWeather(); if (!wxData[ckey(curCourse())]) refresh(); }
  if (e.target.id === 'wxrel'){ wx.rel = e.target.value; store.set('wxRel', wx.rel); renderWeather(); }
  if (e.target.id === 'wxdate'){ wx.day = Number(e.target.value); wx.hourIdx = null; renderWeather(); }
  if (e.target.id === 'wxtime'){ const k = Number(e.target.value); wx.hourIdx = k; wx.clock = hourOf(wxData[ckey(curCourse())].hourly.time[k]); renderWeather(); }
  if (e.target.id === 'wxslope'){ wx.slope = e.target.value; renderWeather(); }
  if (e.target.id === 'wxtarget'){ wx.target = e.target.value; renderWeather(); }
  if (e.target.id === 'wxcold'){ wx.cold = e.target.checked; renderWeather(); }
  if (e.target.id?.startsWith('club-')){ const k = Number(e.target.id.slice(5)), v = Math.round(Number(e.target.value)); if (v > 0 && clubs[k]){ clubs[k][1] = v; store.set('clubs', clubs); } renderWeather(); }
});
$('#refresh').addEventListener('click', refresh);
$('#sheetClose').addEventListener('click', closeGame);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (view !== 'settings') refresh();
  if (detail) loadDetail();
});

// Pull down to refresh
let y0 = null;
addEventListener('touchstart', e => { y0 = scrollY <= 0 && $('#sheet').hidden && view !== 'settings' ? e.touches[0].clientY : null; }, {passive:true});
addEventListener('touchmove', e => { if (y0 != null) $('#pull').style.height = (e.touches[0].clientY - y0 > 70 ? 28 : 0) + 'px'; }, {passive:true});
addEventListener('touchend', () => { if ($('#pull').style.height === '28px') refresh(); $('#pull').style.height = '0'; y0 = null; });

render();
refresh();
</script>
</body>
</html>
